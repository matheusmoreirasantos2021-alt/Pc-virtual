
import tkinter as tk
from tkinter import messagebox
import subprocess
import shutil
import os

APP_NAME = "PC Virtual"

def verificar_virtualizacao():
    if shutil.which("VBoxManage"):
        return "VirtualBox instalado"
    return "VirtualBox não encontrado"

def abrir_virtualbox():
    caminho = shutil.which("VirtualBox")
    if caminho:
        subprocess.Popen([caminho])
    else:
        messagebox.showerror(
            "Erro",
            "Instale o VirtualBox para criar máquinas virtuais."
        )

def mostrar_sistema():
    info = (
        f"Sistema: {os.name}\n"
        f"Python: {__import__('sys').version.split()[0]}\n"
        f"Virtualização: {verificar_virtualizacao()}"
    )
    messagebox.showinfo("Informações do PC", info)

root = tk.Tk()
root.title(APP_NAME)
root.geometry("800x500")
root.configure(bg="#101820")

titulo = tk.Label(
    root,
    text="PC VIRTUAL",
    font=("Segoe UI", 26, "bold"),
    fg="#00d4ff",
    bg="#101820"
)
titulo.pack(pady=25)

subtitulo = tk.Label(
    root,
    text="Painel de gerenciamento de máquinas virtuais",
    font=("Segoe UI", 12),
    fg="white",
    bg="#101820"
)
subtitulo.pack(pady=5)

tk.Button(
    root,
    text="Abrir VirtualBox",
    command=abrir_virtualbox,
    width=30,
    height=2
).pack(pady=15)

tk.Button(
    root,
    text="Informações do sistema",
    command=mostrar_sistema,
    width=30,
    height=2
).pack(pady=10)

tk.Label(
    root,
    text="Requer Oracle VirtualBox para executar máquinas virtuais.",
    fg="#aaaaaa",
    bg="#101820"
).pack(side="bottom", pady=20)

root.mainloop()
